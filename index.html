<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carta para Sol</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4dcdc;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    .heart {
      font-size: 24px;
      color: #ff3b6b;
      animation: float 1s infinite alternate;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      margin: 20px auto;
      cursor: pointer;
    }

    .base {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #ef6f83;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }

    .base::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f38ea0 50%, transparent 50%),
                  linear-gradient(225deg, #ea6078 50%, transparent 50%);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 90px solid #ff496f;
      transform-origin: top;
      transition: transform 0.8s ease;
      z-index: 3;
    }

    .letter {
      position: absolute;
      left: 15px;
      top: 20px;
      width: 230px;
      height: 145px;
      background: #fff5f8;
      border-radius: 6px;
      padding: 15px;
      text-align: center;
      transition: transform 0.8s ease;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .line {
      height: 6px;
      background: #ffd1dc;
      margin: 10px 0;
      border-radius: 4px;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
      display: none;
    }

    .open .flap {
      transform: rotateX(180deg);
    }

    .open .letter {
      transform: translateY(-80px);
    }

    .open .message {
      display: block;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      padding: 10px 20px;
      margin: 0 8px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .open-btn {
      background: white;
      border: 1px solid #ff496f;
      color: #ff496f;
    }

    .reset-btn {
      background: #ff7b93;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="heart">💕 💖 💕</div>

    <div class="envelope" id="envelope">
      <div class="base"></div>
      <div class="letter">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>

        <div class="message">
          <strong>Para Sol ❤️</strong><br/><br/>
          Gracias por estar en mi vida.<br/>
          Eres una persona muy especial para mí 💖
        </div>
      </div>

      <div class="flap"></div>
    </div>

    <div class="buttons">
      <button class="open-btn" onclick="openEnvelope()">OPEN</button>
      <button class="reset-btn" onclick="resetEnvelope()">RESET</button>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');

    function openEnvelope() {
      envelope.classList.add('open');
    }

    function resetEnvelope() {
      envelope.classList.remove('open');
    }
  </script>

</body>
</html>
